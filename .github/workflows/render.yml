name: render
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "URL of bundle.tar"
        required: true
      mode:
        description: "probe, part or full"
        default: "probe"
        required: true
      args:
        description: "extra args, e.g. --start 1 --end 1000"
        default: ""
        required: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch bundle
        run: |
          mkdir ot && cd ot
          curl -sSfL -o b.tar "${{ inputs.bundle_url }}"
          tar -xf b.tar && rm b.tar && ls -la
      - name: Render
        working-directory: ot
        run: |
          pip install -q modal
          modal run modal_render.py::${{ inputs.mode }} ${{ inputs.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            ot/probe_*.png
            ot/office-tower-render.mp4
            ot/seg_*.mp4
          if-no-files-found: ignore
      - name: Publish outputs to branch
        if: always()
        run: |
          mkdir pub && cp ot/probe_*.png ot/seg_*.mp4 ot/office-tower-render.mp4 pub/ 2>/dev/null || true
          cd pub && ls -la && [ "$(ls -A)" ] || exit 0
          git init -q && git checkout -q -b out-${{ github.run_id }} && git add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -qm "outputs ${{ github.run_id }}"
          git push -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD
