name: render
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "URL of bundle.tar"
        required: true
      mode:
        description: "probe or full"
        default: "probe"
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch bundle
        run: |
          mkdir ot && cd ot
          curl -sSfL -o b.tar "${{ inputs.bundle_url }}"
          tar -xf b.tar && rm b.tar && ls -la
      - name: Render
        working-directory: ot
        run: |
          pip install -q modal
          modal run modal_render.py::${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            ot/probe_*.png
            ot/office-tower-render.mp4
          if-no-files-found: ignore
