name: job
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "shell command to run at repo root (Blender at $BLENDER)"
        required: true
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: "1"
      BLENDER: /opt/blender/blender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-4.5.0
      - name: Install
        run: |
          if [ ! -x /opt/blender/blender ]; then
            sudo mkdir -p /opt/blender && sudo chown $USER /opt/blender
            curl -fsSL https://mirrors.ocf.berkeley.edu/blender/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz | tar -xJ -C /opt/blender --strip-components=1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 xvfb ffmpeg mesa-utils >/dev/null
          pip install -q modal
          mkdir -p work out && cd work && cp ../assets/* . && unzip -o -q tex.zip
      - name: Run
        env:
          CMD: ${{ inputs.cmd }}
        run: bash -c "$CMD"
      - name: Publish out/ to branch
        if: always()
        run: |
          cd out && [ "$(ls -A)" ] || exit 0
          git init -q && git checkout -q -b out-${{ github.run_id }} && git add -A
          git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -qm "out ${{ github.run_id }}"
          git push -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD
